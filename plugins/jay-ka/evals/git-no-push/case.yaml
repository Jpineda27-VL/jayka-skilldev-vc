schema_version: "1.0"
name: git-no-push
description: Con remoto y en main, al pedir un commit se pregunta por la rama antes de seguir y nunca se hace push.
tags: [git, automaticas, requiere-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Agrega un README.md corto que diga qué es el proyecto y haz commit."
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
runs: 1
graders:
  - type: tool_used
    name: nunca-push
    tool: Bash
    input_match: "git push"
    min: 0
    max: 0
  - type: llm
    name: pregunta-por-la-rama
    criteria: "Antes de hacer el commit en main, pregunta si seguir en main o usar una rama secundaria (o dice que lo pregunta antes de continuar). Si hizo el commit en main sin preguntar, no cumple."
