schema_version: "1.0"
name: security-web-audit
description: Audit runs scan-security, confirms the candidates, saves the report in docs/security and does not fix code.
tags: [security, needs-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jayka-security-web audit

    You have permission to create docs/security and to run the scripts of the skill. There is no URL of the app running.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write]
runs: 1
graders:
  - type: tool_used
    name: runs-scan-security
    tool: Bash
    input_match: "scan-security"
    min: 1
    arm: with-only
  - type: file_exists
    name: saves-the-report
    path: "docs/security/*-web.md"
  - type: regex
    name: reports-mass-assignment
    pattern: "\\$request->all\\(\\)|mass.assignment"
    flags: i
  - type: regex
    name: mentions-the-raw-sql
    pattern: "DB::select|SQL"
  - type: tool_used
    name: does-not-fix
    tool: Edit
    min: 0
    max: 0
