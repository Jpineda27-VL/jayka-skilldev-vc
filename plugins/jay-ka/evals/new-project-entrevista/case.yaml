schema_version: "1.0"
name: new-project-entrevista
description: Al empezar crea entrevista.md con las 42 entradas pendientes y sus claves, pregunta el primer bloque y no responde por el usuario.
tags: [new-project, sin-shell]
execution:
  prompt: |
    /jay-ka:jay-k-a-new-project

    Tienes permiso para crear la carpeta docs/proyecto.
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Write, Edit]
runs: 1
graders:
  - type: file_exists
    name: crea-entrevista
    path: "docs/proyecto/entrevista.md"
  - type: regex
    name: cuarenta-y-dos-pendientes
    target: { source: file, path: "docs/proyecto/entrevista.md" }
    pattern: "\\*\\*Estado:\\*\\*\\s*pendiente[ \\t]*$"
    flags: m
    match: "count:42"
  - type: regex
    name: usa-claves-estables
    target: { source: file, path: "docs/proyecto/entrevista.md" }
    pattern: "`identidad\\.tonos`"
  - type: regex
    name: no-responde-por-el-usuario
    target: { source: file, path: "docs/proyecto/entrevista.md" }
    pattern: "\\*\\*Estado:\\*\\*\\s*(respondida|saltada|no-sé)"
    match: not_contains
  - type: llm
    name: pregunta-el-primer-bloque
    criteria: "La respuesta final presenta las preguntas del bloque A (El proyecto), numeradas, explica que se contestan por número o con «saltar», y espera al usuario. No inventa respuestas ni avanza a otros bloques."
