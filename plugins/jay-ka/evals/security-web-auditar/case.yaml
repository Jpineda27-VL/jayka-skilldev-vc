schema_version: "1.0"
name: security-web-auditar
description: Auditar corre scan-security, confirma los candidatos, guarda el informe en docs/seguridad y no corrige código.
tags: [security, requiere-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jay-k-a-security-web auditar

    Tienes permiso para crear docs/seguridad y para correr los scripts de la skill. No hay URL de la app corriendo.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write]
runs: 1
graders:
  - type: tool_used
    name: corre-scan-security
    tool: Bash
    input_match: "scan-security"
    min: 1
    arm: with-only
  - type: file_exists
    name: guarda-el-informe
    path: "docs/seguridad/*-web.md"
  - type: regex
    name: reporta-asignacion-masiva
    pattern: "\\$request->all\\(\\)|asignaci[oó]n masiva"
    flags: i
  - type: regex
    name: menciona-el-sql-crudo
    pattern: "DB::select|SQL"
  - type: tool_used
    name: no-corrige
    tool: Edit
    min: 0
    max: 0
