schema_version: "1.0"
name: codex-low-sin-playwright
description: La tarea para Codex anota que no hay Playwright, numera 001, cierra el alcance al archivo pedido y no hace el cambio ella misma.
tags: [codex, sin-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jayka-codex-low Cambiar el texto del botón «Guardar» por «Enviar» en src/form.html

    El Codex que voy a usar no tiene Playwright. La app es HTML estático (se abre el archivo directamente). El repositorio está limpio. Título corto de la tarea: «Botón Enviar». Tienes permiso para crear docs/codex.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Write, Edit]
runs: 1
graders:
  - type: file_exists
    name: crea-la-tarea-001
    path: "docs/codex/tareas/001-boton-enviar.md"
  - type: regex
    name: anota-sin-playwright
    target: { source: file, path: "docs/codex/tareas/001-boton-enviar.md" }
    pattern: "Playwright en tu entorno:\\s*\\**\\s*no\\b"
    flags: i
  - type: regex
    name: alcance-cerrado
    target: { source: file, path: "docs/codex/tareas/001-boton-enviar.md" }
    pattern: "src/form\\.html"
  - type: tool_used
    name: no-hace-el-cambio
    tool: Edit
    input_match: "form.html"
    min: 0
    max: 0
