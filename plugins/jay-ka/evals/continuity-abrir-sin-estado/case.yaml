schema_version: "1.0"
name: continuity-abrir-sin-estado
description: Abrir sin CONTINUAR.md lo dice, resume desde git y no crea ni modifica nada.
tags: [continuity, requiere-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/jay-ka:jay-k-a-continuity abrir"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash, Write]
runs: 1
graders:
  - type: regex
    name: dice-que-no-hay-estado
    pattern: "CONTINUAR\\.md[\\s\\S]{0,80}(no existe|no hay|no encontr)|(no existe|no hay|no encontr)[\\s\\S]{0,80}CONTINUAR\\.md"
    flags: i
  - type: regex
    name: usa-el-commit
    pattern: "formulario de contacto"
    flags: i
  - type: file_exists
    name: no-crea-el-estado
    path: ".claude/estado/CONTINUAR.md"
    exists: false
  - type: tool_used
    name: no-escribe
    tool: Write
    min: 0
    max: 0
