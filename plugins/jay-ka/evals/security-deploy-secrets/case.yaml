schema_version: "1.0"
name: security-deploy-secrets
description: A secret in the git history is found with the script, shown masked, rotation is asked and the verdict is do not publish.
tags: [security, needs-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jayka-security-deploy

    There is no domain yet. It is a Node app without a database, email, uploads or login. You have permission to create docs/security and to run the scripts of the skill.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write]
runs: 1
graders:
  - type: tool_used
    name: runs-scan-git-secrets
    tool: Bash
    input_match: "scan-git-secrets"
    min: 1
    arm: with-only
  - type: regex
    name: asks-to-rotate
    pattern: "rotat"
    flags: i
  - type: regex
    name: do-not-publish
    pattern: "do not publish"
    flags: i
  - type: regex
    name: does-not-show-the-full-secret
    pattern: "51HxABCDEFGHIJKLMN"
    match: not_contains
