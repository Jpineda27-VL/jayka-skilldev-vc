schema_version: "1.0"
name: reverse-live-github-pregunta
description: "tech-reverse con «live» y una URL de github.com debe preguntar si estudia el código o la página (regla 3) en vez de empezar. Sin Bash ni red, así que solo puede responder."
tags: [tech-reverse, convenciones, rapido, sin-shell]
execution:
  prompt: "/jay-ka:jay-k-a-tech-reverse live https://github.com/usuario/plantilla"
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep]
runs: 1
graders:
  - type: regex
    name: pregunta-repo-o-live
    pattern: "(repo|código)[\\s\\S]{0,160}(live|página)[\\s\\S]{0,120}\\?|(live|página)[\\s\\S]{0,160}(repo|código)[\\s\\S]{0,120}\\?"
    flags: i
  - type: llm
    name: no-empieza-el-estudio
    criteria: "La respuesta se limita a preguntar si se estudia el código del repositorio o la página publicada. No anuncia un plan de pasos, no dice que va a clonar ni a abrir la página."
