schema_version: "1.0"
name: continuity-cerrar
description: Cerrar escribe CONTINUAR.md con la plantilla (pendientes, decisiones) y hace commit local, sin push.
tags: [continuity, requiere-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jay-k-a-continuity cerrar

    Contexto de la sesión: agregamos el formulario de login y sus pruebas pasan. Falta la recuperación de contraseña. Decidimos usar sesiones del servidor y no JWT. Tienes permiso para crear la carpeta .claude/estado y para hacer el commit local.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
runs: 1
graders:
  - type: file_exists
    name: crea-continuar
    path: ".claude/estado/CONTINUAR.md"
  - type: regex
    name: tiene-pendientes
    target: { source: file, path: ".claude/estado/CONTINUAR.md" }
    pattern: "##\\s*Pendiente"
  - type: regex
    name: anota-lo-que-falta
    target: { source: file, path: ".claude/estado/CONTINUAR.md" }
    pattern: "recuperaci"
    flags: i
  - type: regex
    name: anota-la-decision
    target: { source: file, path: ".claude/estado/CONTINUAR.md" }
    pattern: "JWT"
  - type: tool_used
    name: hace-commit
    tool: Bash
    input_match: "git commit"
    min: 1
  - type: tool_used
    name: no-hace-push
    tool: Bash
    input_match: "git push"
    min: 0
    max: 0
