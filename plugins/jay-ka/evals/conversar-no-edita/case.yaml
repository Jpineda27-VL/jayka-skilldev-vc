schema_version: "1.0"
name: conversar-no-edita
description: Si el usuario solo pide opinión, se responde sin editar archivos (communication, «conversar no es editar»).
tags: [communication, automaticas, sin-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "¿Te parece buena idea pasar este proyecto de CSS plano a Tailwind? Solo quiero tu opinión, todavía no decido."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Write, Edit]
runs: 1
graders:
  - type: tool_used
    name: no-edita
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-escribe
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: da-una-recomendacion
    criteria: "Responde con una recomendación clara en la primera línea o el primer párrafo, explica en pocas líneas por qué, y no aplica ningún cambio."
