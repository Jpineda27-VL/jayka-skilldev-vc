schema_version: "1.0"
name: menu-catalogo
description: menu muestra las skills con cómo se invocan y su estado de instalación, y termina preguntando cuál usar.
tags: [menu, rapido, sin-shell]
execution:
  prompt: "/jay-ka:jayka-menu"
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
runs: 1
graders:
  - type: regex
    name: lista-reverse
    pattern: "jayka-reverse"
  - type: regex
    name: lista-continuity-con-argumentos
    pattern: "jayka-continuity[^\\n]{0,20}cerrar"
  - type: regex
    name: dice-estado-de-instalacion
    pattern: "instalad[ao]"
    flags: i
  - type: regex
    name: termina-preguntando
    pattern: "¿Cuál quieres usar\\?"
