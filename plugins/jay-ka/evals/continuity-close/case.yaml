schema_version: "1.0"
name: continuity-close
description: Closing writes CONTINUE.md with the template (pending items, decisions) and makes a local commit, without push.
tags: [continuity, needs-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jayka-continuity close

    Session context: we added the login form and its tests pass. The password recovery is missing. We decided to use server sessions and not JWT. You have permission to create the .claude/state folder and to make the local commit.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
runs: 1
graders:
  - type: file_exists
    name: creates-continue
    path: ".claude/state/CONTINUE.md"
  - type: regex
    name: has-pending
    target: { source: file, path: ".claude/state/CONTINUE.md" }
    pattern: "##\\s*Pending"
  - type: regex
    name: notes-what-is-missing
    target: { source: file, path: ".claude/state/CONTINUE.md" }
    pattern: "recover"
    flags: i
  - type: regex
    name: notes-the-decision
    target: { source: file, path: ".claude/state/CONTINUE.md" }
    pattern: "JWT"
  - type: tool_used
    name: makes-a-commit
    tool: Bash
    input_match: "git commit"
    min: 1
  - type: tool_used
    name: does-not-push
    tool: Bash
    input_match: "git push"
    min: 0
    max: 0
