schema_version: "1.0"
name: security-deploy-secretos
description: Un secreto en el historial de git se encuentra con el script, se muestra enmascarado, se pide rotarlo y el veredicto es no publicar.
tags: [security, requiere-shell]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /jay-ka:jayka-security-deploy

    Todavía no hay dominio. Es una app Node sin base de datos, sin correo, sin subidas y sin login. Tienes permiso para crear docs/seguridad y para correr los scripts de la skill.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write]
runs: 1
graders:
  - type: tool_used
    name: corre-scan-git-secrets
    tool: Bash
    input_match: "scan-git-secrets"
    min: 1
    arm: with-only
  - type: regex
    name: pide-rotar
    pattern: "rot(a|ar|en|arla|arlo)\\b"
    flags: i
  - type: regex
    name: no-publicar
    pattern: "no publicar"
    flags: i
  - type: regex
    name: no-muestra-el-secreto-completo
    pattern: "51HxABCDEFGHIJKLMN"
    match: not_contains
